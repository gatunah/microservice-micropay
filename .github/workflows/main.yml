name: Deploy MicroPay Dashboard Demo

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: './micropay-dashboard/demo'

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
